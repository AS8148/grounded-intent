[build-system]
requires = ["setuptools>=75,<80"]
build-backend = "setuptools.build_meta"
[project]
name = "grounded-intent"
version = "0.1.0"
description = "Local Apertus reasoning with grounded, verified robot action plans"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
  "setuptools<80",
  "numpy>=1.26,<3", "opencv-python-headless>=4.10,<6", "pillow>=10,<13",
  "pydantic>=2.10,<3", "httpx>=0.28,<0.29", "fastapi>=0.115,<1", "uvicorn>=0.30,<1",
  "torch>=2.5,<3", "torchvision>=0.20,<1", "transformers>=4.57.0,<5",
  "accelerate>=1,<2", "safetensors>=0.4,<1", "ultralytics>=8.4.0,<9",
  "openai-clip>=1.0.1", "huggingface-hub>=0.27,<2",
  "fpdf2>=2.8,<3", "fonttools>=4.34.0",
]

[project.optional-dependencies]
vision = [
  "torch>=2.5,<3", "torchvision>=0.20,<1", "transformers>=4.57.0,<5",
  "accelerate>=1,<2", "safetensors>=0.4,<1", "ultralytics>=8.4.0,<9",
  "openai-clip>=1.0.1", "huggingface-hub>=0.27,<2",
]
test = ["pytest>=8,<10", "hypothesis>=6,<7", "jsonschema>=4,<5", "ruff>=0.9,<1"]
report = ["fpdf2>=2.8,<3", "fonttools>=4.34.0"]
[project.scripts]
grounded-intent = "grounded_intent.cli:main"

[tool.setuptools.package-data]
grounded_intent = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra"
markers = ["models: requires running local model servers and weights"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP", "I"]
